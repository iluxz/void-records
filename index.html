<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>void records</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="waves"></canvas>

<div id="shell">
  <header>
    <h1>void records</h1>
    <p>68 tracks</p>
  </header>

  <div id="stage">
    <section id="deck">
      <div id="turntable">
        <div id="disc">
          <div id="label"><span id="labelTitle">void</span></div>
        </div>
        <div id="arm"><div id="armHead"></div></div>
      </div>

      <div id="now">
        <div id="nowTitle">no record loaded</div>
        <div id="nowMeta">click a track on the right</div>
      </div>

      <input id="seek" type="range" min="0" max="1000" value="0">
      <div id="times"><span id="tCur">0:00</span><span id="chips"><button id="btnCrackle" class="chip on" title="vinyl crackle (c)">&#8779;</button><button id="btnSleep" class="chip" title="sleep timer: off / 15 / 30 / 60">&#9201;</button></span><span id="tDur">--:--</span></div>

      <div id="controls">
        <button id="btnPrev" title="previous">&#9198;</button>
        <button id="btnPlay" title="play / pause">&#9654;</button>
        <button id="btnNext" title="next">&#9197;</button>
        <button id="btnShuffle" title="shuffle">&#128256;</button>
        <button id="btnLoop" title="loop one">&#128257;</button>
        <button id="btnSet" title="music settings">&#9881;</button>
        <label id="volWrap" title="volume">&#128266;<input id="vol" type="range" min="0" max="100" value="70"></label>
      </div>

      <div id="setPanel">
        <div class="setRow">
          <label>speed</label>
          <input id="setSpeed" type="range" min="0.5" max="2" step="0.01" value="1">
          <span id="setSpeedV">1.00&times;</span>
        </div>
        <div class="setRow">
          <label>pitch</label>
          <input id="setPitch" type="range" min="-12" max="12" step="1" value="0">
          <span id="setPitchV">0 st</span>
        </div>
        <div class="setRow">
          <label>tone</label>
          <input id="setToneS" type="range" min="400" max="16000" step="100" value="16000">
          <span id="setToneV">open</span>
        </div>
      </div>

      <canvas id="bars"></canvas>
    </section>

    <section id="listWrap">
      <input id="filter" type="text" placeholder="filter&hellip;" spellcheck="false">
      <ol id="list"></ol>
    </section>
  </div>

  <footer><button id="btnTutorial">replay tutorial</button></footer>
</div>

<div id="tutSpot" hidden></div>
<div id="tutTip" hidden>
  <div class="tutTitle"></div>
  <div class="tutBody"></div>
  <button class="tutBtn" hidden></button>
</div>
<button id="tutSkip" hidden>skip</button>

<script src="tracks.js"></script>
<script src="visualizer.js"></script>
<script src="player.js"></script>
</body>
</html>
